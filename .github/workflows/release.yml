name: Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix)'
        required: true
        default: '0.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Core & Proxy Tests
        run: dotnet test tests/AgentProxyHub.Tests/AgentProxyHub.Tests.csproj -c Release
      - name: Build Windows Setup Installer (Inno Setup 6)
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) { $ver = "${{ github.ref_name }}".TrimStart('v') }
          ./installer/windows/build-installer.ps1 -Version $ver
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/AgentProxyHub-Setup-*.exe
            dist/SHA256SUMS.txt

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build macOS Apple Silicon DMG
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          chmod +x installer/macos/build-dmg.sh
          ./installer/macos/build-dmg.sh osx-arm64 "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate Release Notes from CHANGELOG & Commits
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          CHANGELOG_SECTION=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_SECTION="$(awk -v ver="[${TAG}]" '
              index($0, "## " ver) == 1 { flag=1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md | sed '/^---$/d')"
          fi
          if [ -z "$(echo "${CHANGELOG_SECTION}" | tr -d '[:space:]')" ]; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force --tags || true
            OBJ_TYPE="$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || true)"
            if [ "${OBJ_TYPE}" = "tag" ]; then
              CHANGELOG_SECTION="$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}")"
            fi
          fi
          {
            if [ -n "$(echo "${CHANGELOG_SECTION}" | tr -d '[:space:]')" ]; then
              echo "${CHANGELOG_SECTION}"
              echo ""
            fi
            if [ -n "${PREV_TAG}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release_notes.md
          cat release_notes.md
      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            artifacts/windows-installer/*
            artifacts/macos-dmg/*
